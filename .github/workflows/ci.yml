name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      MOONBIT_INSTALL_VERSION: '0.10.11+6ff76a5f9'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL --retry 3 --max-time 120 https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check package and test all supported backends
        run: |
          moon version --all
          moon update
          moon check --target all --deny-warn
          moon test --target all --deny-warn
          moon fmt --check
      - name: Build CLI and verify Java interoperability
        run: |
          moon build --target native --release --deny-warn
          scripts/verify-interop.sh _build/native/release/build/cmd/hlog/hlog.exe
      - name: Verify the packaged library and installed CLI
        run: |
          moon package
          scripts/verify-consumer.sh _build/publish/guo-dong-123-moon-hlog-*.zip
      - name: Bundle the verified Linux executable
        run: |
          install -m 755 _build/native/release/build/cmd/hlog/hlog.exe "$RUNNER_TEMP/hlog"
          tar -czf "$RUNNER_TEMP/moonhlog-linux-x86_64.tar.gz" -C "$RUNNER_TEMP" hlog -C "$GITHUB_WORKSPACE" LICENSE -C "$GITHUB_WORKSPACE/tests/fixtures" baseline.hlog candidate.hlog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moonhlog-linux-x86_64
          path: ${{ runner.temp }}/moonhlog-linux-x86_64.tar.gz
          if-no-files-found: error
